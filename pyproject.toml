[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cross-system-context-test"
version = "0.1.1"
description = "A controlled experiment engine for testing whether cross-system business context improves business decisions."
requires-python = ">=3.12"
[project.scripts]
cross-system-context = "experiment.cli:main"
[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]
nlp-experiment = [
    "spacy==3.8.16",
]
