name: CI

on:
  push:
    branches:
      - v02-boundary-audit
  pull_request:
    branches:
      - v02-boundary-audit

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: CLI smoke tests
        run: python -m pytest -q tests/test_cli.py

      - name: Validate frozen fixtures
        run: python -m experiment.cli validate

      - name: Run frozen v0.2 experiment
        run: python -m experiment.cli run
